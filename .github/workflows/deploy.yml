name: Deploy SWin Casino

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      APP_URL: https://swin.scoware.com
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_INSTALLER: ${{ secrets.DEPLOY_INSTALLER || 'false' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ==================== DEPENDENCIES ====================

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: bcmath, ctype, curl, dom, fileinfo, json, mbstring, openssl, pdo, pdo_mysql, tokenizer, xml, zip, gd
          tools: composer:v2

      - name: Install Composer dependencies (production)
        working-directory: core
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-interaction --no-progress

      # ==================== SSH SETUP ====================

      - name: Setup SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$DEPLOY_PORT" -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Validate remote PHP 8.2+ availability
        run: |
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'ENDSSH'
          set -e

          REMOTE_PHP=""
          for candidate in php8.2 php82 /opt/cpanel/ea-php82/root/usr/bin/php php8.3 php83 /opt/cpanel/ea-php83/root/usr/bin/php php; do
            if command -v "$candidate" >/dev/null 2>&1; then
              version="$($candidate -r 'echo PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION;' 2>/dev/null || true)"
              major="${version%%.*}"
              minor="${version##*.}"
              if [ "$major" = "8" ] && [ "$minor" -ge 2 ] 2>/dev/null; then
                REMOTE_PHP="$candidate"
                break
              fi
            fi
          done

          if [ -z "$REMOTE_PHP" ]; then
            echo "ERROR: No PHP 8.2+ CLI binary found on server."
            echo "Install/enable PHP 8.2 or higher for this account, then set the CLI default or adjust workflow candidate paths."
            exit 1
          fi

          echo "Using remote PHP binary: $REMOTE_PHP"
          "$REMOTE_PHP" -v
          ENDSSH

      # ==================== DEPLOYMENT ====================

      - name: Deploy SWin Casino application
        run: |
          set -euo pipefail

          rsync_excludes=(
            --exclude='.git*'
            --exclude='.github*'
            --exclude='node_modules'
            --exclude='cgi-bin/'
            --exclude='.well-known/'
            --exclude='.env'
            --exclude='.env.*'
            --exclude='storage/'
            --exclude='sitemap.xml'
            --exclude='robots.xml'
            --exclude='assets/admin/push_config.json'
            --exclude='assets/admin/images/profile/'
            --exclude='assets/images/extensions/'
            --exclude='assets/images/frontend/'
            --exclude='assets/images/game/'
            --exclude='assets/images/gateway/'
            --exclude='assets/images/language/'
            --exclude='assets/images/logo_icon/'
            --exclude='assets/images/maintenance/'
            --exclude='assets/images/push_notification/'
            --exclude='assets/images/seo/'
            --exclude='assets/images/user/'
            --exclude='assets/images/verify/'
            --exclude='assets/images/withdraw_method/'
            --exclude='assets/in_app_purchase_config/'
            --exclude='assets/support/'
            --exclude='assets/templates/basic/css/custom.css'
            --exclude='assets/templates/sunfyre/css/custom.css'
            --exclude='core/.env'
            --exclude='core/.env.*'
            --exclude='core/bootstrap/cache/'
            --exclude='core/storage/'
            --exclude='core/resources/lang/*.json'
          )

          if [ "$DEPLOY_INSTALLER" != "true" ]; then
            rsync_excludes+=(--exclude='install/')
          fi

          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p $DEPLOY_PORT -o StrictHostKeyChecking=no" \
            "${rsync_excludes[@]}" \
            ./ ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.APP_PATH }}/

      # ==================== POST-DEPLOYMENT ====================

      - name: Validate .env configuration
        if: env.DEPLOY_INSTALLER != 'true'
        run: |
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'ENDSSH'
          set -e
          ENV_FILE="${{ secrets.APP_PATH }}/core/.env"
          if [ ! -f "$ENV_FILE" ]; then
            echo "ERROR: .env file not found at $ENV_FILE"
            echo "Please run the web installer at your application URL /install to configure the application."
            exit 1
          fi
          echo "✓ .env file exists"
          if ! grep -q '^DB_CONNECTION=' "$ENV_FILE"; then
            echo "WARNING: DB_CONNECTION not set in .env; adding DB_CONNECTION=mysql"
            echo "DB_CONNECTION=mysql" >> "$ENV_FILE"
          fi
          echo "✓ DB_CONNECTION is configured"
          ENDSSH

      - name: Prepare runtime directories
        run: |
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "mkdir -p '${{ secrets.APP_PATH }}/core/storage/app/public' '${{ secrets.APP_PATH }}/core/storage/framework/cache/data' '${{ secrets.APP_PATH }}/core/storage/framework/sessions' '${{ secrets.APP_PATH }}/core/storage/framework/views' '${{ secrets.APP_PATH }}/core/storage/logs' '${{ secrets.APP_PATH }}/core/bootstrap/cache'"

      - name: Set Laravel permissions
        run: |
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'ENDSSH'
          cd ${{ secrets.APP_PATH }}
          chmod -R 775 core/storage core/bootstrap/cache
          chmod -R 775 core/storage/app core/storage/framework core/storage/logs core/bootstrap/cache
          ENDSSH

      - name: Warm Laravel caches
        if: env.DEPLOY_INSTALLER != 'true'
        run: |
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'ENDSSH'
          set -e

          REMOTE_PHP=""
          for candidate in php8.2 php82 /opt/cpanel/ea-php82/root/usr/bin/php php8.3 php83 /opt/cpanel/ea-php83/root/usr/bin/php php; do
            if command -v "$candidate" >/dev/null 2>&1; then
              version="$($candidate -r 'echo PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION;' 2>/dev/null || true)"
              major="${version%%.*}"
              minor="${version##*.}"
              if [ "$major" = "8" ] && [ "$minor" -ge 2 ] 2>/dev/null; then
                REMOTE_PHP="$candidate"
                break
              fi
            fi
          done

          if [ -z "$REMOTE_PHP" ]; then
            echo "ERROR: Cannot warm caches because PHP 8.2+ CLI was not found."
            exit 1
          fi

          cd ${{ secrets.APP_PATH }}/core
          "$REMOTE_PHP" artisan optimize:clear || true
          "$REMOTE_PHP" artisan config:cache
          "$REMOTE_PHP" artisan route:cache
          "$REMOTE_PHP" artisan event:cache
          "$REMOTE_PHP" artisan view:cache || true
          ENDSSH

      - name: Validate deployment
        if: always()
        run: |
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'ENDSSH'
          echo "=== Deployment Validation ==="
          echo ""
          echo "Application:"
          echo "  App path exists: $([ -d "${{ secrets.APP_PATH }}" ] && echo "✓" || echo "✗")"
          echo "  Root index exists: $([ -f "${{ secrets.APP_PATH }}/index.php" ] && echo "✓" || echo "✗")"
          echo "  Root .htaccess exists: $([ -f "${{ secrets.APP_PATH }}/.htaccess" ] && echo "✓" || echo "✗")"
          echo "  Composer autoload exists: $([ -f "${{ secrets.APP_PATH }}/core/vendor/autoload.php" ] && echo "✓" || echo "✗")"
          if [ "${{ env.DEPLOY_INSTALLER }}" = "true" ]; then
            echo "  Installer folder exists: $([ -f "${{ secrets.APP_PATH }}/install/index.php" ] && echo "✓" || echo "✗")"
            echo "  .env file intentionally absent until installation completes"
          else
            echo "  .env file exists: $([ -f "${{ secrets.APP_PATH }}/core/.env" ] && echo "✓" || echo "✗")"
            echo "  Config cached: $([ -f "${{ secrets.APP_PATH }}/core/bootstrap/cache/config.php" ] && echo "✓" || echo "✗")"
          fi
          echo ""
          echo "Writable runtime data:"
          echo "  Core storage exists: $([ -d "${{ secrets.APP_PATH }}/core/storage" ] && echo "✓" || echo "✗")"
          echo "  Frontend uploads preserved: $([ -d "${{ secrets.APP_PATH }}/assets/images/frontend" ] && echo "✓" || echo "✗")"
          echo ""
          echo "=== Deployment Complete ==="
          ENDSSH

      - name: Notify deployment success
        if: success()
        run: |
          echo "✓ SWin Casino deployed successfully to ${{ env.APP_URL }}"
          echo "✓ Application URL: ${{ env.APP_URL }}"

      - name: Notify deployment failure
        if: failure()
        run: |
          echo "✗ Deployment failed. Check the logs above for details."
          exit 1
